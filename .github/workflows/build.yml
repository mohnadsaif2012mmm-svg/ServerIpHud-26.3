name: Build mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ] || [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f ServerIpHud-26.3/settings.gradle ] || [ -f ServerIpHud-26.3/settings.gradle.kts ] || [ -f ServerIpHud-26.3/build.gradle ] || [ -f ServerIpHud-26.3/build.gradle.kts ]; then
            echo "dir=ServerIpHud-26.3" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Gradle project files not found."
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

      - name: Build mod
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build
          else
            gradle build
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: server-ip-hud-26.3
          path: |
            **/build/libs/*.jar
          if-no-files-found: error
